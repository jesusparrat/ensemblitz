name: Weekly predictions
on:
  schedule:
    - cron: "0 7 * * 2"   # Tuesday 07:00 UTC = 08:00 (winter) / 09:00 (summer) Madrid
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weekly
  cancel-in-progress: false
jobs:
  predict:
    # the odds secret must never be reachable from a dispatch on another branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: true  # needed by the final git push (job token, contents: write)
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      - run: uv venv --python 3.12 && uv pip install -e .
      - name: Update nflverse data
        run: uv run ensemblitz update
      - name: Predict next week
        run: uv run ensemblitz predict
      - name: Grade finished games
        run: uv run ensemblitz grade
      - name: Odds comparison (skipped without ODDS_API_KEY)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: uv run ensemblitz odds
      - name: Validate outputs (no NaN, no empty weeks, no secrets)
        run: uv run python scripts/validate_outputs.py
      - name: Commit predictions and results
        run: |
          git config user.name "ensemblitz-bot"
          git config user.email "ensemblitz-bot@users.noreply.github.com"
          git add predictions results reports/odds
          git diff --cached --quiet || git commit -m "chore: weekly predictions and results [skip ci]"
          git push
