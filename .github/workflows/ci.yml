name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          fetch-depth: 0  # the baseline gate compares against origin/main on pull requests
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      - run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run ensemblitz site
      - run: uv run python scripts/check_site.py
      - run: uv run python scripts/validate_outputs.py --site site/_build
      # a few seconds: strict walk-forward re-stack of the cached component predictions
      - name: Baseline gate (ensemble and model-only must not get worse)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            uv run python scripts/check_baseline.py --ref "origin/$BASE_REF"
          else
            uv run python scripts/check_baseline.py
          fi
