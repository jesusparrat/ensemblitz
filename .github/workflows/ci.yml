name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  UV_FROZEN: "1"  # every `uv run` uses uv.lock as is, never re-resolves
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the baseline gate compares against origin/main on pull requests
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      - run: uv lock --check  # uv.lock must match pyproject.toml
      - run: uv sync --frozen --extra dev  # Python from .python-version
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run ensemblitz site
      - run: uv run python scripts/check_site.py
      - run: uv run python scripts/validate_outputs.py --site site/_build
      - name: Verify prediction integrity
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
            uv run python scripts/verify_integrity.py --base-ref "origin/$BASE_REF"
          else
            uv run python scripts/verify_integrity.py --base-ref HEAD~1
          fi
      # a few seconds: strict walk-forward re-stack of the cached component predictions
      - name: Baseline gate (ensemble and model-only must not get worse)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            uv run python scripts/check_baseline.py --ref "origin/$BASE_REF"
          else
            uv run python scripts/check_baseline.py
          fi
      - name: Offline PR2 statistical audit
        run: uv run python scripts/audit_pr2.py
      - name: Upload PR2 audit report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pr2-statistical-audit
          path: |
            reports/pr2_statistical_audit.json
            reports/pr2_statistical_audit_summary.json
            docs/audit/pr2-statistical-audit.md
          if-no-files-found: error
          retention-days: 7
