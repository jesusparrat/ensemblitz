name: Baseline full recompute
# Regenerates Elo, Kalman and LightGBM from fresh nflverse data and checks they still match the
# committed baseline. Slower and network-bound, so it is not part of every pull request.
on:
  schedule:
    - cron: "0 8 * * 1"   # Monday 08:00 UTC
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: baseline-full
  cancel-in-progress: true
env:
  UV_FROZEN: "1"  # every `uv run` uses uv.lock as is, never re-resolves
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      - run: uv lock --check  # uv.lock must match pyproject.toml
      - run: uv sync --frozen --extra dev  # Python from .python-version
      - run: uv run ensemblitz update
      - run: uv run python scripts/check_baseline.py --full
