name: Baseline full recompute
# Regenerates Elo, Kalman and LightGBM from fresh nflverse data and checks they still match the
# committed baseline. Slower and network-bound, so it is not part of every pull request.
on:
  schedule:
    - cron: "0 8 * * 1"   # Monday 08:00 UTC
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: baseline-full
  cancel-in-progress: true
env:
  UV_FROZEN: "1"  # every `uv run` uses uv.lock as is, never re-resolves
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      - run: uv lock --check  # uv.lock must match pyproject.toml
      - run: uv sync --frozen --extra dev  # Python from .python-version
      - name: Compute closed-season PBP cache key
        id: pbp_cache
        run: |
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          from ensemblitz import config as C
          from ensemblitz.data.download import current_season, pbp_schema_hash

          cur = current_season()
          print(f"first_season={C.FIRST_SEASON}")
          print(f"current_season={cur}")
          print(f"last_closed={cur - 1}")
          print(f"schema_hash={pbp_schema_hash()}")
          PY
      - name: Cache closed-season PBP parquets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            data/raw/pbp_*.parquet
            !data/raw/pbp_${{ steps.pbp_cache.outputs.current_season }}.parquet
          key: pbp-closed-${{ steps.pbp_cache.outputs.first_season }}-${{ steps.pbp_cache.outputs.last_closed }}-${{ steps.pbp_cache.outputs.schema_hash }}-${{ hashFiles('uv.lock') }}
      - run: uv run ensemblitz update
      - run: uv run python scripts/check_baseline.py --full
